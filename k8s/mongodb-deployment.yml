apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
    template:
      metadata:
        labels:
          app: mongodb-pod
          namespace: chat-app
          labels:
            app: mongodb
      spec:
        containers:
        - name: chatapp-mongodb
          image: mongodb:latest
          ports:
          - containerPort: 27017
          env:
          - name: MONGODB_INITDB_ROOT_USERNAME
            value: root
          - name: MONGODB_INITDB_ROOT_PASSWORD
            value: rootpassword
        volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc

